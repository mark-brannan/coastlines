name: test
on:
  push: { branches: [main] }
  pull_request:

# The tests run pull-request-authored code. Nothing here needs to write to the
# repository, and the checkout's token should not outlive the step.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['20', '22', '24']
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: '${{ matrix.node }}' }
      # No install step: coastlines has no runtime dependencies, and the tests must
      # pass with the network unavailable.
      - run: npm test

  # The single required status check. Everything else fans in here, so the
  # ruleset requires one context and adding or renaming a matrix leg does not
  # silently change what is required. `always()` is what lets it evaluate when
  # a dependency was skipped rather than being skipped itself -- a required
  # context that inherits a skip never reports, and blocks the pull request
  # forever. No `name:` here, deliberately: the reported context is the job id.
  ci-gate:
    needs: [test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "test: ${{ needs.test.result }}"
          if [ "${{ needs.test.result }}" != "success" ]; then
            exit 1
          fi
