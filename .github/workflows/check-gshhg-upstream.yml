name: check-gshhg-upstream
# Weekly: does upstream GSHHG still serve the zip coastlines mirrors as the
# data-gshhg-<version> release? sync reads the mirror, so this job is the only
# thing that talks to the upstream host. Verdicts and fetch bounds are in
# scripts/check-gshhg-upstream.sh; on "changed" this opens an issue naming the
# candidate, since a 149 MB zip cannot ride in a PR and adopting it is a review.
#
# Cost: one job a week (plus one on a PR that edits this check), one 149 MB download.
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/check-gshhg-upstream.yml
      - scripts/check-gshhg-upstream.sh

jobs:
  check:
    runs-on: ubuntu-latest
    # Above the script's own fetch bounds, so a hung host reads as unreachable first.
    timeout-minutes: 4
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - id: check
        run: bash scripts/check-gshhg-upstream.sh
      # Issues only from the schedule or a dispatch: a PR run is a test of the check.
      - name: Open a release-candidate issue
        if: steps.check.outputs.verdict == 'changed' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TITLE: ${{ steps.check.outputs.title }}
        run: |
          if gh issue list --state all --search "\"$TITLE\" in:title" --json number -q '.[].number' | grep -q .; then
            echo "already filed: $TITLE"; exit 0
          fi
          gh issue create --title "$TITLE" --body-file "$RUNNER_TEMP/gshhg-issue.md"
