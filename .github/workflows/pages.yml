name: pages
on:
  push: { branches: [main] }
  workflow_dispatch:

permissions:
  contents: read

concurrency: { group: pages, cancel-in-progress: true }

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: actions/setup-node@v7
        with: { node-version: '22' }
      # No install: the demo has no build dependencies. sync fetches the pinned
      # Natural Earth release (45 MB) and the GSHHG zip (149 MB, ~90 s together),
      # cached by the manifest's hash and verified byte for byte on every run;
      # build:pages copies the three charts' files into _site.
      - uses: actions/cache@v4
        with:
          path: data
          key: data-${{ hashFiles('manifest.json') }}
      - run: npm run sync
      - run: npm run build:pages
      - uses: actions/upload-pages-artifact@v5
        with: { path: _site }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Only this job publishes, so only this job gets the write scopes.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
