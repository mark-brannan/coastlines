name: Release

# The whole release mechanism, shared across every repository that
# publishes. A merge to main updates a standing "chore: release" pull
# request; merging THAT pull request is the release. See
# mark-brannan/.github/.github/workflows/release-please.yml for the full
# rationale (batching, squash-merge requirement, tag format, version
# policy).
#
# This repo has a publish.yml (#14), so the shared workflow's default
# `publish: true` applies: on a release it dispatches publish.yml and
# waits for it to succeed.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  release:
    uses: mark-brannan/.github/.github/workflows/release-please.yml@main
    secrets:
      RELEASE_PLEASE_APP_CLIENT_ID: ${{ secrets.RELEASE_PLEASE_APP_CLIENT_ID }}
      RELEASE_PLEASE_APP_PRIVATE_KEY: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
