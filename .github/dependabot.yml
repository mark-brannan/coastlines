# npm weekly for runtime + dev deps (grouped — this repo is small enough
# that one PR beats N), github-actions weekly for the workflow pins.
# commit-message prefixes match CONTRIBUTING.md's conventional-commit rule.
version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      dependencies:
        patterns: ['*']
    commit-message:
      prefix: build
      prefix-development: chore

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    commit-message:
      prefix: ci
