name: New file, chart or capability
description: Ask for a Natural Earth file, a chart or a style that does not ship yet
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        Every file is bytes in every install of this package, forever, for
        everyone who wanted a different one, and this package has a size line
        to hold. So the use case decides it, not the file.

        If you need one file for one project, you do not need this package:
        fetch it from the [Natural Earth tree](https://github.com/nvkelso/natural-earth-vector/tree/v5.1.2/geojson)
        at the pinned tag, record its sha256, and commit it. That is a
        completely reasonable answer and it costs nobody else anything.

  - type: textarea
    id: use
    attributes:
      label: What is on screen, or what is the plugin deciding?
      description: >
        The display and what the reader is doing with it, or the plugin and
        what it looks up. This is the field that decides the issue.
      placeholder: >
        A routing plugin that wants the 10m ocean polygon as a sea mask; the
        50m one misses channels we sail.
    validations:
      required: true

  - type: dropdown
    id: kind
    attributes:
      label: What kind of change is it
      options:
        - A Natural Earth file this package does not ship
        - A new chart, or a layer added to one
        - A style change
        - Something about packaging, exports, or ids
        - Something else
    validations:
      required: true

  - type: input
    id: file
    attributes:
      label: The Natural Earth file, if you know it
      description: Its name in the v5.1.2 geojson tree, and its raw size.
      placeholder: 'ne_10m_ocean.geojson, 10.2 MB'
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: What do you use today?
      description: >
        A file you bundle yourself, a tile server, another package.
    validations:
      required: false
