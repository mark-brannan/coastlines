name: Bug report
description: A published file, id, chart or style is wrong
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        **Check which repository first** — it saves a round trip:

        - The *shape* is wrong (a missing island, a line across a strait) →
          this package ships Natural Earth's file unchanged:
          [natural-earth-vector](https://github.com/nvkelso/natural-earth-vector/issues).
        - The GeoJSON is right and the *picture* is wrong in coast-wright →
          [coast-wright](https://github.com/mark-brannan/coast-wright/issues).
        - Which files ship, under which ids, in which charts, with which
          styles, or a file disagreeing with its manifest entry → here.

        When in doubt, file it here and it will be moved.

        Security problems go through a
        [private advisory](https://github.com/mark-brannan/coastlines/security/advisories/new)
        instead — including a file that does not match its manifest entry.
        See SECURITY.md.

  - type: dropdown
    id: kind
    attributes:
      label: What kind of problem
      options:
        - A file does not match its manifest entry
        - An import path or export does not resolve
        - A chart or style draws the wrong thing
        - The catalogue table in the README does not match the manifest
        - Something else
    validations:
      required: true

  - type: input
    id: file
    attributes:
      label: Which id, chart or style
      placeholder: 'ne-coastline-50m'
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what you expected
      description: >
        If a file looks altered, give the sha256 you computed and the one the
        manifest records.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: coastlines version
      description: '`npm ls coastlines`.'
      placeholder: '0.0.1-alpha.0'
    validations:
      required: true

  - type: input
    id: decoder
    attributes:
      label: What is reading it
      description: >
        coast-wright, MapLibre, a Signal K plugin, or something else.
      placeholder: 'Freeboard 3.2.1'
    validations:
      required: true

