blank_issues_enabled: true
contact_links:
  - name: Security vulnerability
    url: https://github.com/mark-brannan/coastlines/security/advisories/new
    about: Report privately, not as a public issue. See SECURITY.md.
  - name: The picture is wrong, not the JSON
    url: https://github.com/mark-brannan/coast-wright/issues
    about: coast-wright draws GeoJSON to a canvas. Seams, projections and anything that only goes wrong on screen belong there.
  - name: Natural Earth data
    url: https://github.com/nvkelso/natural-earth-vector/issues
    about: The geometry is Natural Earth's, unchanged. A missing island or a misplaced coastline belongs upstream — this package records a digest and does not vouch for the cartography.
