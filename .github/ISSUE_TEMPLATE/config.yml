blank_issues_enabled: true
contact_links:
  - name: Security vulnerability
    url: https://github.com/mark-brannan/coastlines/security/advisories/new
    about: Report privately, not as a public issue. A file that does not reproduce from its own provenance is one of these. See SECURITY.md.
  - name: The shape itself is wrong
    url: https://github.com/mark-brannan/portolani/issues
    about: Simplification, clipping and the antimeridian belong to the generator. This package is only the output of running it.
  - name: The picture is wrong, not the JSON
    url: https://github.com/mark-brannan/coast-wright/issues
    about: coast-wright decodes and draws. Seams, projections and anything that only goes wrong on screen belong there.
  - name: The portolano format itself
    url: https://github.com/mark-brannan/portolani/blob/main/docs/portolano-format.md
    about: The format is specified independently, including the nine-line decoder and the change policy. Read it before writing a decoder or proposing a change.
  - name: Natural Earth data
    url: https://github.com/nvkelso/natural-earth-vector/issues
    about: The geometry derives from Natural Earth. Missing or misplaced real-world coastline belongs upstream — this package records a digest and does not vouch for the cartography.
